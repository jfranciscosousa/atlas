name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Tooling tests
        run: pnpm run test:tooling

      - name: Type check
        run: pnpm run web:check

      - name: Unit tests
        run: pnpm run web:test

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
      PGPORT: 5433
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1.2"

      - uses: actions/cache@v4
        with:
          path: |
            apps/api/deps
            apps/api/_build
          key: mix-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/api/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-

      - name: Install Mix dependencies
        working-directory: apps/api
        run: mix deps.get

      - name: Run tests
        working-directory: apps/api
        run: mix test
