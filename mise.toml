[tools]
node = "26.12.0"
pnpm = "12.14.0"
elixir = "1.20.4-otp-29"
erlang = "29.1.2"
postgres = "18.6"

[env]
PGDATA = "{{ env.PGDATA | default(value=env.HOME ~ '/.local/share/postgres', boolean=true) }}"

[tasks."db:init"]
description = "Initialize the shared PostgreSQL cluster"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ ! -f "$PGDATA/PG_VERSION" ]]; then
  initdb -U postgres -A scram-sha-256 --pwfile=<(printf '%s\n' postgres)
fi
'''

[tasks."db:start"]
description = "Initialize and start the shared PostgreSQL server"
depends = ["db:init"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
if ! pg_ctl status; then
  pg_ctl -l "$PGDATA/server.log" -o "-h localhost -k \"$PGDATA\" -p ${PGPORT:-5432}" start
fi
'''

[tasks."db:stop"]
description = "Stop the shared PostgreSQL server"
run = "pg_ctl stop -m fast"
